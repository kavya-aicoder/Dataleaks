[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataleaks"
version = "0.1.0"
description = "Automatic data leakage detection for machine learning workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Kavya Rajput" }
]

dependencies = [
    "pandas>=1.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6"
]

[project.scripts]
dataleaks = "dataleaks.cli:main"

[tool.setuptools.packages.find]
include = ["dataleaks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]